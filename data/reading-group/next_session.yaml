  description: |
    LeMat-Synth is an open-source toolbox for extracting structured synthesis procedures and performance data from materials science literature. This session explores how it turns scientific papers into machine-readable databases that connect how materials are made with how they perform.

    **About the speaker:** Magdalena Lederbauer is a PhD student at MIT in Chemical Engineering and Computing. Her research applies machine learning and computational methods to chemistry, with a focus on structure elucidation and catalysis.
